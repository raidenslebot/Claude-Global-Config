<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark redrawn for 16 to 48 px: the ring's stroke is 22% of the width (7 of 32) and the
    waterline 3 of 32, so both survive at 16 px where the 4.6% stroke of mark.svg would be a
    grey blur. The counter stays open: inner radius 6.5 of 32. Navy ring on a transparent
    ground; in dark mode the ring turns cream, so it reads on either tab colour.
  -->
  <style>
    .ring { stroke: #1f2a44; } .bar { fill: #1f2a44; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #efe9dc; } .bar { fill: #efe9dc; } }
  </style>
  <circle class="ring" cx="16" cy="16" r="10" fill="none" stroke-width="7"/>
  <rect class="bar" x="3" y="14.5" width="26" height="3"/>
</svg>
