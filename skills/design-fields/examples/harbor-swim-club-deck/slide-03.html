<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harbor Swim Club — annual meeting, 3</title><link rel="stylesheet" href="deck.css"></head>
<!-- The chart: twelve bars standing on the waterline, which is the axis. One series; the busiest
     month emphasised; the takeaway is the title; the axis is labelled once; no legend. -->
<body>
<section class="slide" style="--water: 66%">
  <div class="head"><span>Swims by month</span><span>September 2025 to August 2026</span></div>
  <h2 style="position:absolute; left:96px; top:150px; max-width:30ch; font-size:84px">January was the busiest month — nine degrees, and fifty-one swims.</h2>
  <div class="chart">
    <svg viewBox="0 0 1728 340" aria-label="Swims per month: Sep 31, Oct 35, Nov 29, Dec 33, Jan 51, Feb 38, Mar 34, Apr 30, May 33, Jun 32, Jul 34, Aug 32">
      <!-- bars: value × 5 px; the baseline is y = 300, six pixels above the waterline; the chart
           stands under the title, never through it -->
      <g class="bars">
        <rect class="bar" x="20"   y="145" width="104" height="155"/><text class="val" x="72"   y="131">31</text><text class="month" x="72"   y="334">Sep</text>
        <rect class="bar" x="164"  y="125" width="104" height="175"/><text class="val" x="216"  y="111">35</text><text class="month" x="216"  y="334">Oct</text>
        <rect class="bar" x="308"  y="155" width="104" height="145"/><text class="val" x="360"  y="141">29</text><text class="month" x="360"  y="334">Nov</text>
        <rect class="bar" x="452"  y="135" width="104" height="165"/><text class="val" x="504"  y="121">33</text><text class="month" x="504"  y="334">Dec</text>
        <rect class="bar hot" x="596" y="45" width="104" height="255"/><text class="val" x="648" y="31">51</text><text class="month" x="648" y="334">Jan</text>
        <rect class="bar" x="740"  y="110" width="104" height="190"/><text class="val" x="792"  y="96">38</text><text class="month" x="792"  y="334">Feb</text>
        <rect class="bar" x="884"  y="130" width="104" height="170"/><text class="val" x="936"  y="116">34</text><text class="month" x="936"  y="334">Mar</text>
        <rect class="bar" x="1028" y="150" width="104" height="150"/><text class="val" x="1080" y="136">30</text><text class="month" x="1080" y="334">Apr</text>
        <rect class="bar" x="1172" y="135" width="104" height="165"/><text class="val" x="1224" y="121">33</text><text class="month" x="1224" y="334">May</text>
        <rect class="bar" x="1316" y="140" width="104" height="160"/><text class="val" x="1368" y="126">32</text><text class="month" x="1368" y="334">Jun</text>
        <rect class="bar" x="1460" y="130" width="104" height="170"/><text class="val" x="1512" y="116">34</text><text class="month" x="1512" y="334">Jul</text>
        <rect class="bar" x="1604" y="140" width="104" height="160"/><text class="val" x="1656" y="126">32</text><text class="month" x="1656" y="334">Aug</text>
      </g>
      <text class="axis" x="1728" y="20" text-anchor="end">SWIMS PER MONTH · THE WATERLINE IS ZERO</text>
    </svg>
  </div>
  <div class="water"></div>
  <div class="foot">3 / 7</div>
</section>
</body></html>
