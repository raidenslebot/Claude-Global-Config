<svg xmlns="http://www.w3.org/2000/svg" width="24in" height="28in" viewBox="0 0 24 28" data-garment="hoodie" data-view="front">
  <!-- Adult pullover hoodie, front, flat at true scale (inches): hood down, kangaroo pocket, ribbed hem and cuffs. -->
  <style>
    .body { fill: var(--garment, #d9d6cf); stroke: #2b2b2b; stroke-width: 0.03; stroke-linejoin: round; }
    .seam { fill: none; stroke: #2b2b2b; stroke-width: 0.02; stroke-dasharray: 0.12 0.08; opacity: 0.55; }
    .rib  { fill: var(--garment, #d9d6cf); stroke: #2b2b2b; stroke-width: 0.03; }
    .zone { fill: none; stroke: #c0392b; stroke-width: 0.03; stroke-dasharray: 0.2 0.12; }
    .zone-label { font: 0.32px "Helvetica Neue", Arial, sans-serif; fill: #c0392b; }
  </style>
  <g id="garment">
    <!-- hood, lying flat behind the shoulders -->
    <path class="body" d="M 7.4 5.2 C 6.8 1.4 17.2 1.4 16.6 5.2 C 15.2 3.8 8.8 3.8 7.4 5.2 Z" />
    <!-- torso + sleeves -->
    <path class="body" d="
      M 7.2 4.8  C 9.0 4.4 15.0 4.4 16.8 4.8
      L 23.2 8.4  L 22.4 19.6  L 19.0 19.4
      L 19.0 26.4  L 5.0 26.4  L 5.0 19.4
      L 1.6 19.6  L 0.8 8.4  Z" />
    <!-- neck opening -->
    <path class="body" d="M 9.4 4.7 C 10.4 6.4 13.6 6.4 14.6 4.7 Z" />
    <!-- kangaroo pocket -->
    <path class="seam" d="M 6.6 19.2 L 8.2 25.2 L 15.8 25.2 L 17.4 19.2" />
    <!-- ribbed hem and cuffs -->
    <rect class="rib" x="5.0" y="26.4" width="14" height="1.3" />
    <rect class="rib" x="1.6" y="19.6" width="3.4" height="1.2" transform="rotate(4 3.3 20.2)" />
    <rect class="rib" x="19.0" y="19.6" width="3.4" height="1.2" transform="rotate(-4 20.7 20.2)" />
    <path class="seam" d="M 5.0 8.9 L 5.0 26.4 M 19.0 8.9 L 19.0 26.4" />
  </g>
  <g id="zones">
    <rect class="zone" x="7" y="8.5" width="10" height="8" /><text class="zone-label" x="7.15" y="8.95">front</text>
    <rect class="zone" x="13.5" y="8.5" width="4" height="4" /><text class="zone-label" x="13.65" y="8.95">left-chest</text>
    <rect class="zone" x="9" y="0.8" width="6" height="4.5" /><text class="zone-label" x="9.15" y="1.25">hood</text>
    <rect class="zone" x="19.5" y="8" width="3" height="3" /><text class="zone-label" x="19.6" y="8.4">sleeve</text>
    <rect class="zone" x="13" y="20.5" width="3.5" height="2.5" /><text class="zone-label" x="13.15" y="20.95">pocket</text>
  </g>
</svg>
