<svg xmlns="http://www.w3.org/2000/svg" width="22in" height="29in" viewBox="0 0 22 29" data-garment="tee" data-view="front">
  <!-- Adult unisex tee, front, flat at true scale (inches). Fill the body with --garment. -->
  <style>
    .body { fill: var(--garment, #d9d6cf); stroke: #2b2b2b; stroke-width: 0.03; stroke-linejoin: round; }
    .seam { fill: none; stroke: #2b2b2b; stroke-width: 0.02; stroke-dasharray: 0.12 0.08; opacity: 0.55; }
    .zone { fill: none; stroke: #c0392b; stroke-width: 0.03; stroke-dasharray: 0.2 0.12; }
    .zone-label { font: 0.32px "Helvetica Neue", Arial, sans-serif; fill: #c0392b; }
  </style>
  <g id="garment">
    <!-- torso + sleeves as one outline; shoulder slope, set-in sleeves, straight hem -->
    <path class="body" d="
      M 6.6 0.9  C 8.2 0.4 13.8 0.4 15.4 0.9
      L 21.2 4.2  L 19.4 9.0  L 16.8 8.2
      L 16.8 28.6  L 5.2 28.6  L 5.2 8.2
      L 2.6 9.0  L 0.8 4.2  Z" />
    <!-- crew neck: front drop -->
    <path class="body" d="M 8.2 0.75 C 9.2 2.9 12.8 2.9 13.8 0.75 C 12.6 0.45 9.4 0.45 8.2 0.75 Z" />
    <!-- collar seam (where placement is measured from) -->
    <path class="seam" d="M 8.0 1.1 C 9.2 3.6 12.8 3.6 14.0 1.1" />
    <!-- side seams and sleeve hems -->
    <path class="seam" d="M 5.2 8.2 L 5.2 28.6 M 16.8 8.2 L 16.8 28.6" />
    <path class="seam" d="M 2.6 9.0 L 5.2 8.2 M 19.4 9.0 L 16.8 8.2" />
    <path class="seam" d="M 5.2 28.0 L 16.8 28.0" />
  </g>
  <g id="zones">
    <rect class="zone" x="5" y="7" width="12" height="14" /><text class="zone-label" x="5.15" y="7.45">full-front</text>
    <rect class="zone" x="12.5" y="7" width="4" height="4" /><text class="zone-label" x="12.65" y="7.45">left-chest</text>
    <rect class="zone" x="5.5" y="7" width="4" height="4" /><text class="zone-label" x="5.65" y="7.45">right-chest</text>
    <rect class="zone" x="18.2" y="6" width="3" height="3" /><text class="zone-label" x="18.3" y="6.4">sleeve</text>
    <rect class="zone" x="0.8" y="6" width="3" height="3" /><text class="zone-label" x="0.9" y="6.4">sleeve</text>
    <rect class="zone" x="13" y="24.5" width="4" height="2.5" /><text class="zone-label" x="13.15" y="24.95">hem-left</text>
    <rect class="zone" x="5" y="24.5" width="4" height="2.5" /><text class="zone-label" x="5.15" y="24.95">hem-right</text>
  </g>
</svg>
