name: ci

on:
  push:
  pull_request:

# Nothing in this pipeline writes to the repo. This is a public mirror of a personal
# ~/.claude directory, so the token handed to every step is read-only by construction.
permissions:
  contents: read

jobs:
  checks:
    strategy:
      # Eight bugs fixed in this repo were platform-conditional in OPPOSITE directions
      # (backslash paths dead on POSIX, .cmd spawn dead on Windows). One OS catches at most
      # half of that class, so both run. fail-fast stays off because the default would
      # cancel the second OS the moment the first failed — hiding exactly the
      # opposite-direction result this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Step bodies below are POSIX (`|| true`, if/then, [ -f ... ]). The Windows runner
        # defaults to pwsh, where `true` is not a command and the if/then body does not
        # parse. GitHub ships bash on every hosted OS, so one default keeps each step's
        # semantics identical on both instead of annotating steps one by one.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest": tools/run-tests.mjs exists precisely because `node --test <dir>`
      # and glob expansion differ between Node 20 and later majors. Moving this pin silently
      # changes which code path the test invocations below take.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # FIRST, and gating everything after it. This repo mirrors ~/.claude, which sits one
      # directory away from .credentials.json (live Claude OAuth access + refresh tokens)
      # and .claude.json (mcpOAuth client secrets). If a credential ever reaches the tree,
      # the run stops here — before any later step can cache, log or publish it.
      - name: Secret scan
        run: node tools/scan-secrets.mjs

      # doctor.mjs reports on a real machine's install: resolved node path, linked skills,
      # hook registration in settings.json. A hosted runner has none of that, so every
      # finding is machine-specific noise. Run it to prove it still executes, never let it
      # fail the build.
      - name: Config doctor (informational)
        run: node tools/doctor.mjs --json || true

      # sync.mjs --check diffs the live ~/.claude against what this repo has committed and
      # exits 1 on any difference. That is the guard against the repo silently drifting
      # behind the config it claims to mirror — someone edits ~/.claude by hand, never runs
      # sync, and the published repo quietly stops matching reality. A hosted runner has no
      # ~/.claude to compare against, so here it can only report "nothing tracked"; the
      # check does its real work on a developer machine or a self-hosted runner. Kept in CI
      # so the command stays exercised and cannot rot unnoticed.
      - name: Config drift check
        run: node tools/sync.mjs --check
        continue-on-error: true

      # The root suite under tools/test/ — the gate. This is where the portability, path
      # substitution and hook-syntax invariants are pinned, and until this step existed
      # nothing automatic ran them. run-tests.mjs hands node explicit absolute file paths
      # because neither `node --test <dir>` nor a glob is portable across Node 20/24 or
      # across sh and cmd.exe. No continue-on-error: a failure here fails the build on
      # whichever OS produced it.
      - name: Root test suite
        run: node tools/run-tests.mjs

      - name: argo test suite
        working-directory: argo
        # argo declares zero dependencies, so there is nothing to install. `npm test` runs
        # test/run.js, which hands node explicit file paths — the one form of test
        # invocation that is identical on Node 20 and 24, under sh and under cmd.exe.
        # (`node --test test/` resolves the directory as a module on some Node builds and
        # a quoted glob only expands on 21+; both used to be in here as fallbacks.)
        run: npm test
